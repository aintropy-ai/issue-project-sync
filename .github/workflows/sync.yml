name: Sync Org Issues to Project

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Sync issues created after this ISO 8601 timestamp (default: 15 min ago)'
        required: false

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Add new org issues to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: |
          SINCE="${{ github.event.inputs.since }}"
          if [ -z "$SINCE" ]; then
            SINCE=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          fi

          echo "Searching org:aintropy-ai for issues created since $SINCE"

          URLS=$(gh api \
            "search/issues?q=org:aintropy-ai+is:issue+created:>${SINCE}&sort=created&order=desc&per_page=100" \
            --jq '.items[].html_url')

          if [ -z "$URLS" ]; then
            echo "No new issues found."
            exit 0
          fi

          while IFS= read -r url; do
            echo "Adding: $url"
            gh project item-add 1 --owner aintropy-ai --url "$url" \
              && echo "  -> added" \
              || echo "  -> skipped (already in project or transient error)"
          done <<< "$URLS"
